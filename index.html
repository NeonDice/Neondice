<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeonDice</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a11;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{min-height:100vh;display:grid;grid-template-columns:210px 1fr 300px}.side,.chat{background:#090b12;padding:18px}.side{border-right:1px solid #282e43}.chat{border-left:1px solid #282e43;display:flex;flex-direction:column}
.logo{font-size:21px;font-weight:900;margin:8px 10px 25px}.logo span{color:#a34fff}.nav button,.btn{width:100%;padding:11px;border:0;border-radius:10px;margin:5px 0;background:#171b2b;color:#fff;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,#667dff,#a34fff)!important}
main{padding:24px;max-width:1050px;width:100%;margin:auto}.top{display:flex;justify-content:space-between}.muted{color:#929ab1}.status{color:#38d69d;font-size:12px;margin-top:4px}
.hero,.card,.game{background:#111522;border:1px solid #282e43;border-radius:16px;padding:18px;margin-top:16px}.dice{height:220px;margin-top:18px;border-radius:15px;background:radial-gradient(circle,#29335e,#151927 65%);display:grid;place-items:center}.cube{width:100px;height:100px;border-radius:20px;background:linear-gradient(140deg,#718aff,#7042d8);display:grid;place-items:center;font-size:38px;font-weight:900}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{width:auto}.grid{display:grid;grid-template-columns:1fr;gap:14px}.icon{width:45px;height:45px;border-radius:11px;background:linear-gradient(140deg,#7085ff,#994cf1);display:grid;place-items:center;font-size:20px}
.game{min-height:360px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 25%,#1d1630 0,#0d0c17 48%,#090911 100%);border-color:#3b255c;box-shadow:inset 0 1px 0 #ffffff12,0 10px 35px #0006}
.game:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 0%,#8e46ff08 50%,transparent 100%);pointer-events:none}
.gamehead{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.battle{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:8px;margin-top:18px;position:relative;z-index:1}.fighter{text-align:center}.avatar{width:74px;height:74px;margin:0 auto 9px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#a74cff,#281341 64%,#120c1c 65%);border:3px solid #5c2e91;box-shadow:0 0 0 8px #281642,0 0 22px #8d42ff55;font-size:36px}.dice-mini{display:flex;justify-content:center;gap:6px}.dice-mini span{width:34px;height:34px;border:1px solid #6b3db0;border-radius:9px;display:grid;place-items:center;background:#11101c;font-weight:900;font-size:17px}.vs{text-align:center;font-weight:900;color:#d7caff;font-size:18px}.pot{text-align:center;margin:22px 0 20px;position:relative;z-index:1}.pot .pet{font-size:43px}.pot .value{font-size:31px;font-weight:950;line-height:1.1}.pot .range{font-size:13px;color:#a8a0bd;margin-top:6px}.tag{display:inline-block;margin-top:13px;border:1px solid #6940a1;background:#26143d;border-radius:999px;padding:8px 15px;color:#d6c7ee;font-size:12px;font-weight:900}.game-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1;margin-top:10px}.game-actions .btn{margin:0;border-radius:14px;padding:14px;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{background:#1c2132;border:1px solid #30374e;border-radius:8px;padding:5px 8px;font-size:12px}
.messages{flex:1;overflow:auto;margin:15px 0}.msg{padding:7px 0}.msg b{color:#b7c1ff}.msg p{margin:3px 0}.send{display:flex;gap:7px}.send input{min-width:0;flex:1;background:#151a29;border:1px solid #282e43;border-radius:9px;padding:10px;color:white}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.box{background:#111522;border:1px solid #323950;border-radius:17px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto}.head{display:flex;justify-content:space-between}.close{background:none;border:0;color:#aaa;font-size:28px}.modalgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check{display:flex;align-items:center;gap:8px}.check input{width:18px;height:18px}
input{background:#151a29;color:white;border:1px solid #30374e;border-radius:9px;padding:11px;width:100%}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#171b2b;padding:12px;border-radius:10px}.big{font-size:22px;font-weight:900}
@media(max-width:900px){.app{grid-template-columns:70px 1fr}.chat{display:none}.logo{font-size:0}.logo span{font-size:18px}.nav button{font-size:0}.nav button:first-letter{font-size:19px}}
@media(max-width:600px){.app{display:block}.side{display:none}main{padding:12px}.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo">NEON<span>DICE</span></div><div class="nav">
<button onclick="home()">🎲 Dice</button><button onclick="createGame()">🎮 Create</button><button onclick="inventory()">🎒 Inventory</button><button onclick="deposit()">📦 Deposit</button><button onclick="admin()">🛡️ Admin</button><button onclick="backend()">⚙️ Backend</button>
</div></aside>
<main>
<div class="top"><div><b>NeonDice</b><div class="muted">Online Dice Games</div><div id="status" class="status">● Demo-Modus</div></div><div id="user">Gast</div></div>
<div class="hero"><h1>🎲 Two Dice Battle</h1><p class="muted">Zwei Spieler · zwei Würfel von 1–6 · höhere Summe gewinnt.</p>
<div class="dice"><div class="cube" id="die">?</div></div>
<div class="actions"><button class="btn primary" onclick="createGame()">Create Game</button><button class="btn" onclick="inventory()">🎒 Inventory</button><button class="btn" onclick="deposit()">📦 Deposit</button></div></div>
<section><h2>Offene Games</h2><div id="games" class="grid"><div class="card muted">Demo-Lobbys werden hier angezeigt.</div></div></section>
</main>
<aside class="chat"><b>💬 Global Chat</b><div class="messages" id="messages"></div><div class="send"><input id="chatInput" placeholder="Nachricht..." maxlength="120"><button class="btn primary" style="width:auto" onclick="sendMessage()">➤</button></div></aside>
</div>
<div class="modal" id="modal"><div class="box"><div class="head"><h2 id="title"></h2><button class="close" onclick="closeModal()">×</button></div><div id="body"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb=null,user=null,inv=[],selected=new Set(),games=[],deposits=[],adminMode=false;
const OWNER_USER_ID="SET_YOUR_OWNER_SUPABASE_USER_ID";
const FEE_RATE=0.05;
const KEY="neondice_supabase_v3";
const demoItems=[["🐱","Huge Cosmic",1250],["🐉","Titanic Dragon",980],["🌈","Rainbow Cat",740],["🔥","Golden Phoenix",510],["💎","Gems",100]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const roll=()=>Math.floor(Math.random()*6)+1;
function modal(t,b){$("title").textContent=t;$("body").innerHTML=b;$("modal").classList.add("open")}function closeModal(){$("modal").classList.remove("open")}
function home(){closeModal();window.scrollTo(0,0)}
function backend(){let c=JSON.parse(localStorage.getItem(KEY)||"{}");modal("⚙️ Supabase verbinden",`<p class="muted">Project URL</p><input id="url" value="${esc(c.url||"")}" placeholder="https://deinprojekt.supabase.co"><p class="muted">Publishable Key</p><input id="api" value="${esc(c.api||"")}" placeholder="sb_publishable_..."><button class="btn primary" onclick="connect()">Verbinden</button><p class="muted">Nur Publishable/Anon-Key verwenden. Niemals Secret/Service-Role-Key in HTML eintragen.</p>`)}
async function connect(){let url=$("url").value.trim(),api=$("api").value.trim();if(!url||!api)return alert("Bitte beide Felder eintragen.");localStorage.setItem(KEY,JSON.stringify({url,api}));try{sb=window.supabase.createClient(url,api);let s=await sb.auth.getSession();if(!s.data.session){let a=await sb.auth.signInAnonymously();if(a.error)throw a.error}s=await sb.auth.getSession();user=s.data.session.user;$("status").textContent="● Online";$("user").textContent="User "+user.id.slice(0,6);await loadInventory();await loadGames();await loadMessages();await loadDeposits();closeModal()}catch(e){alert("Supabase-Fehler: "+e.message)}}
async function loadInventory(){if(!sb)return;let q=await sb.from("inventory").select("*").eq("user_id",user.id);inv=q.data||[];if(!inv.length){await sb.from("inventory").insert(demoItems.map(x=>({user_id:user.id,icon:x[0],name:x[1],value:x[2]})));q=await sb.from("inventory").select("*").eq("user_id",user.id);inv=q.data||[]}}
function inventory(){if(!sb)return backend();modal("🎒 Inventory",`<div class="modalgrid">${inv.map(x=>`<div class="card"><span class="icon">${esc(x.icon)}</span><b>${esc(x.name)}</b><br><span class="muted">${Number(x.value).toLocaleString()} value</span></div>`).join("")}</div>`)}
function createGame(){if(!sb)return demoGame();selected=new Set();modal("🎮 Create Game",`<p class="muted">Wähle Einsatz-Items.</p>${inv.map(x=>`<label class="card check"><input type="checkbox" onchange="toggle('${x.id}',this.checked)"><span>${esc(x.icon)} ${esc(x.name)} — ${Number(x.value).toLocaleString()}</span></label>`).join("")}<button class="btn primary" onclick="makeGame()">Game erstellen</button>`)}
function toggle(id,on){on?selected.add(id):selected.delete(id)}
async function makeGame(){let items=inv.filter(x=>selected.has(x.id));if(!items.length)return alert("Mindestens ein Item wählen.");let value=items.reduce((s,x)=>s+Number(x.value),0);let ownerFee=Math.floor(value*FEE_RATE);
let q=await sb.from("games").insert({creator_id:user.id,creator_name:"Player-"+user.id.slice(0,6),creator_items:items,creator_value:value,owner_fee_rate:FEE_RATE,owner_fee_value:ownerFee,owner_id:OWNER_USER_ID,status:"open"});if(q.error)return alert(q.error.message);closeModal();loadGames()}
async function loadGames(){if(!sb)return renderGames();let q=await sb.from("games").select("*").eq("status","open").order("created_at",{ascending:false});games=q.data||[];renderGames()}
function renderGames(){
$("games").innerHTML=games.map(g=>{
 const first=(g.creator_items||[])[0]||{icon:"❓",name:"Einsatz"};
 const value=Number(g.creator_value||0);
 const rangeLow=(value*0.95).toLocaleString();
 const rangeHigh=(value*1.05).toLocaleString();
 return `<div class="game">
  <div class="gamehead"><b>⚔️ ${esc(g.creator_name)}</b><span class="chip">Titanic/Gem only</span></div>
  <div class="battle">
   <div class="fighter"><div class="avatar">${esc(g.creator_avatar||"🙂")}</div><div class="dice-mini"><span>?</span><span>?</span></div></div>
   <div class="vs">VS</div>
   <div class="fighter"><div class="avatar">❓</div><div class="dice-mini"><span>?</span><span>?</span></div></div>
  </div>
  <div class="pot"><div class="pet">${esc(first.icon)}</div><div class="value">${value.toLocaleString()}</div><div class="range">${rangeLow} – ${rangeHigh}</div><div class="tag">TITANIC/GEM ONLY</div></div>
  <div class="game-actions"><button class="btn primary" onclick="joinGame('${g.id}')">Join</button><button class="btn" onclick="viewGame('${g.id}')">View</button></div>
 </div>`
}).join("")||`<div class="card muted">Keine offenen Games.</div>`}
function viewGame(id){const g=games.find(x=>x.id===id);if(!g)return;const first=(g.creator_items||[])[0]||{icon:"❓",name:"Einsatz"};modal("👀 Game ansehen",`<div class="game" style="margin-top:0"><div class="battle"><div class="fighter"><div class="avatar">${esc(g.creator_avatar||"🙂")}</div><b>${esc(g.creator_name)}</b></div><div class="vs">VS</div><div class="fighter"><div class="avatar">❓</div><b>Waiting</b></div></div><div class="pot"><div class="pet">${esc(first.icon)}</div><div class="value">${Number(g.creator_value||0).toLocaleString()}</div><div class="range">${(Number(g.creator_value||0)*.95).toLocaleString()} – ${(Number(g.creator_value||0)*1.05).toLocaleString()}</div><div class="tag">TITANIC/GEM ONLY</div></div></div>`)}
async function joinGame(id){let q=await sb.from("games").select("*").eq("id",id).single();if(q.error)return alert(q.error.message);modal("🤝 Game beitreten",`<p>Gegner: <b>${esc(q.data.creator_name)}</b></p><p class="muted">Wähle deine Einsatz-Items:</p>${inv.map(x=>`<label class="card check"><input type="checkbox" onchange="toggle('${x.id}',this.checked)"><span>${esc(x.icon)} ${esc(x.name)} — ${Number(x.value).toLocaleString()}</span></label>`).join("")}<button class="btn primary" onclick="joinNow('${id}')">Join & Würfeln</button>`)}
async function joinNow(id){let items=inv.filter(x=>selected.has(x.id));if(!items.length)return alert("Wähle mindestens ein Item.");let value=items.reduce((s,x)=>s+Number(x.value),0);let h1=roll(),h2=roll(),g1=roll(),g2=roll(),ht=h1+h2,gt=g1+g2,winner=ht>gt?user.id:gt>ht?"opponent":null;let opponentValue=Number((await sb.from("games").select("creator_value").eq("id",id).single()).data.creator_value||0);
let potValue=value+opponentValue;
let fee=Math.floor(potValue*FEE_RATE);
let winnerNet=Math.max(0,potValue-fee);closeModal();modal("🎲 Ergebnis",`<div class="statgrid"><div class="stat"><b>Deine Würfel</b><div class="big">${g1} + ${g2}</div><span>${gt}</span></div><div class="stat"><b>Gegner</b><div class="big">${h1} + ${h2}</div><span>${ht}</span></div><div class="stat"><b>Owner Fee</b><div class="big">5%</div><span>${fee.toLocaleString()} → Owner</span></div></div><p class="muted" style="text-align:center">Gewinner-Netto: ${winnerNet.toLocaleString()} · Owner-Gebühr: ${fee.toLocaleString()}</p><h2 style="text-align:center">${winner===user.id?"🏆 DU GEWINNST!":winner===null?"🤝 UNENTSCHIEDEN":"❌ DU VERLIERST"}</h2>`);await sb.from("games").update({status:"finished",joiner_id:user.id,joiner_items:items,joiner_value:value,rolls:{host:[h1,h2],guest:[g1,g2]},winner_id:winner}).eq("id",id)}
function demoGame(){let a=roll(),b=roll(),c=roll(),d=roll(),x=a+b,y=c+d;modal("🎲 Demo-Runde",`<div class="statgrid"><div class="stat"><b>Spieler 1</b><div class="big">${a} + ${b}</div><span>${x}</span></div><div class="stat"><b>Spieler 2</b><div class="big">${c} + ${d}</div><span>${y}</span></div></div><h2 style="text-align:center">${x>y?"🏆 Spieler 1 gewinnt!":y>x?"🏆 Spieler 2 gewinnt!":"🤝 Unentschieden!"}</h2>`)}
function deposit(){modal("📦 Einzahlung",`<p class="muted">Für den Start wird nur eine Einzahlung zur manuellen Verifikation angelegt. Keine automatische Roblox-Trade-Ausführung.</p><p class="muted">Roblox Username</p><input id="roblox" placeholder="Dein Roblox-Username"><p class="muted">Was wird eingezahlt?</p><input id="item" placeholder="z.B. Gems / Titanic"><p class="muted">Wert</p><input id="value" type="number" min="0" placeholder="0"><button class="btn primary" onclick="createDeposit()">Einzahlung anlegen</button>`)}
async function createDeposit(){let roblox=$("roblox").value.trim(),item=$("item").value.trim(),value=Number($("value").value);if(!roblox||!item||!value)return alert("Bitte alle Felder ausfüllen.");if(!sb){return alert("Verbinde zuerst Supabase.")}let q=await sb.from("deposits").insert({user_id:user.id,roblox_username:roblox,item_name:item,value,status:"pending"});if(q.error)return alert(q.error.message);closeModal();alert("Deposit angelegt. Status: PENDING");loadDeposits()}
async function loadDeposits(){if(!sb)return;let q=await sb.from("deposits").select("*").eq("user_id",user.id).order("created_at",{ascending:false});deposits=q.data||[]}
function admin(){if(!sb)return backend();modal("🛡️ Admin",`<p class="muted">Der Admin-Bereich muss serverseitig über Supabase-Rollen geschützt werden. Diese Demo zeigt noch keine privilegierten Daten an.</p><div class="statgrid"><div class="stat"><b>Deposits</b><div class="big">${deposits.length}</div></div><div class="stat"><b>Inventory</b><div class="big">${inv.length}</div></div><div class="stat"><b>Gebühr</b><div class="big">5%</div></div></div>`)}
async function loadMessages(){if(!sb)return;let q=await sb.from("messages").select("*").order("created_at",{ascending:true}).limit(100);$("messages").innerHTML=(q.data||[]).map(m=>`<div class="msg"><b>${esc(m.username)}</b><p>${esc(m.body)}</p></div>`).join("")}
async function sendMessage(){let text=$("chatInput").value.trim();if(!text)return;if(!sb)return alert("Verbinde zuerst Supabase.");let q=await sb.from("messages").insert({user_id:user.id,username:"Player-"+user.id.slice(0,6),body:text});if(q.error)alert(q.error.message);else $("chatInput").value=""}
const saved=JSON.parse(localStorage.getItem(KEY)||"{}");if(saved.url&&saved.api)setTimeout(()=>backend(),300);
</script>
</body></html>
